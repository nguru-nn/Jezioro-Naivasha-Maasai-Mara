<!-- External Dependencies -->
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --safari-highlight: #FFD700;
        --safari-dark: #1e293b;
        --safari-text: #475569;
        --safari-glass: rgba(253, 251, 247, 0.85);
        --safari-glass-border: rgba(255, 215, 0, 0.3);
    }

    .wp-safari-itinerary-container {
        position: relative; 
        width: 100%; 
        height: 700px;
        max-height: 85vh;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: #fdfbf7;
        overflow: hidden; 
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    #safari-map {
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        width: 100%; height: 100%;
        z-index: 1;
    }

    .itinerary-sidebar {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 320px;
        max-height: calc(100% - 40px);
        background: var(--safari-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--safari-glass-border);
        border-radius: 16px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        overflow: hidden;
    }

    .itinerary-header { padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .itinerary-header h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--safari-dark); text-transform: uppercase; letter-spacing: 1px; }
    .itinerary-list { padding: 16px 16px 30px 16px; overflow-y: auto; flex-grow: 1; }

    .itinerary-card {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .itinerary-card:hover, .itinerary-card.active { background: #fff; border-color: var(--safari-highlight); transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255, 215, 0, 0.15); }
    .itinerary-day { font-size: 11px; font-weight: 700; color: #b49700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .itinerary-title { font-size: 14px; font-weight: 600; color: var(--safari-dark); margin-bottom: 4px; }
    .itinerary-lodge { font-size: 12px; color: var(--safari-text); }
</style>

<div class="wp-safari-itinerary-container">
    <div id="safari-map"></div>
    <div class="itinerary-sidebar">
        <div class="itinerary-header"><h3>Plan Podróży Safari</h3></div>
        <div class="itinerary-list" id="itinerary-list"></div>
    </div>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<script>
(function() {
    mapboxgl.accessToken = '';

    const itineraryData = [
        { id: 'start', dayString: 'Start', title: 'Przylot', lodge: 'Międzynarodowe Lotnisko Jomo Kenyatta', coords: [36.9272, -1.3192] },
        { id: 'day1', dayString: 'Dzień 1', title: 'Nairobi', lodge: 'Hemingways Nairobi', coords: [36.7570, -1.3530] },
        { id: 'wp_limuru', isWaypoint: true, title: 'Wzgórza Limuru', coords: [36.6350, -1.1070] },
        { id: 'day2', dayString: 'Dzień 2', title: 'Jezioro Naivasha', lodge: 'Loldia House', coords: [36.3311, -0.6865] },
        { id: 'day3', dayString: 'Dzień 3', title: 'Jezioro Naivasha', lodge: 'Crescent Island Game Sanctuary', coords: [36.4385, -0.7712] },
        { id: 'wp_maimahiu', isWaypoint: true, title: 'Mai Mahiu', coords: [36.5828, -1.0177] },
        { id: 'wp_narok', isWaypoint: true, title: 'Miasto Narok', coords: [35.8604, -1.0889] },
        { id: 'day4', dayString: 'Dzień 4', title: 'Masai Mara', lodge: 'Governors Camp', coords: [35.2530, -1.2850] },
        { id: 'day5', dayString: 'Dzień 5', title: 'Mara Triangle', lodge: 'Mara Triangle', coords: [34.9067, -1.4067] },
        { id: 'day6', dayString: 'Dzień 6', title: 'Talek', lodge: 'Talek', coords: [35.1443, -1.4063] },
        { id: 'wp_narok_return', isWaypoint: true, title: 'Miasto Narok (Powrót)', coords: [35.8604, -1.0889] },
        { id: 'wp_maimahiu_return', isWaypoint: true, title: 'Mai Mahiu (Powrót)', coords: [36.5828, -1.0177] },
        { id: 'day7', dayString: 'Dzień 7', title: 'Powrót do Nairobi', lodge: 'Hemingways Nairobi', coords: [36.7570, -1.3530] },
        { id: 'day8', dayString: 'Dzień 8', title: 'Wylot', lodge: 'Międzynarodowe Lotnisko Jomo Kenyatta', coords: [36.9272, -1.3192] }
    ];

    const map = new mapboxgl.Map({
        container: 'safari-map',
        style: 'mapbox://styles/mapbox/standard-satellite',
        center: [36, -1],
        zoom: 7,
        pitch: 60
    });

    map.on('load', async () => {
        map.addSource('mapbox-dem', { 'type': 'raster-dem', 'url': 'mapbox://mapbox.mapbox-terrain-dem-v1', 'tileSize': 512 });
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

        const routeCoords = itineraryData.map(d => d.coords);
        
        map.addSource('route', { 'type': 'geojson', 'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': routeCoords } } });
        map.addLayer({ 'id': 'route-line-dashed', 'type': 'line', 'source': 'route', 'paint': { 'line-color': '#FFD700', 'line-width': 4, 'line-dasharray': [0, 4, 3] } });

        const dashArraySequence = [[0, 4, 3], [0.5, 4, 2.5], [1, 4, 2], [1.5, 4, 1.5], [2, 4, 1], [2.5, 4, 0.5], [3, 4, 0]];
        let step = 0;
        function animate() {
            step = (step + 1) % dashArraySequence.length;
            map.setPaintProperty('route-line-dashed', 'line-dasharray', dashArraySequence[step]);
            requestAnimationFrame(() => setTimeout(animate, 100));
        }
        animate();
    });

    itineraryData.forEach(stop => {
        if (stop.isWaypoint) return;
        const marker = new mapboxgl.Marker({ color: '#FFD700' }).setLngLat(stop.coords).addTo(map);
        const card = document.createElement('div');
        card.className = 'itinerary-card';
        card.innerHTML = `<div class="itinerary-day">${stop.dayString}</div><div class="itinerary-title">${stop.title}</div><div class="itinerary-lodge">${stop.lodge}</div>`;
        card.onclick = () => map.flyTo({ center: stop.coords, zoom: 12, pitch: 65 });
        document.getElementById('itinerary-list').appendChild(card);
    });
})();
</script>
